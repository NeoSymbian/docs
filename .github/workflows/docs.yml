# SPDX-License-Identifier: Apache-2.0
name: docs
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tools -q
      - run: python3 -m unittest discover -s hardware/tools -q
      - run: python3 tools/check-links.py
      - run: python3 tools/roadmap.py --check
